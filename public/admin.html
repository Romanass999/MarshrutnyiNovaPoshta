<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Адмінка — Маршрутний Нова Пошта</title><style>
:root{--red:#e30613;--bg:#f4f5f7;--card:#fff;--text:#1b1d21;--muted:#747981;--line:#e5e7eb;--ok:#16834b;--warn:#b26a00;--danger:#c62828}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.layout{display:flex;min-height:100vh}.side{width:250px;background:#17181b;color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;font-size:18px;padding:10px 12px 22px}.brand small{display:block;color:#aaa;font-weight:500;margin-top:4px}.nav button{width:100%;text-align:left;background:transparent;color:#ddd;padding:12px 14px;border-radius:10px;margin:2px 0}.nav button:hover,.nav button.active{background:#2a2b2f;color:#fff}.nav .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:12px}.main{margin-left:250px;width:calc(100% - 250px);padding:24px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:26px}.userbox{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{font-size:27px;display:block;margin-top:5px}.stat span{color:var(--muted);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff}.btn{background:#222;color:#fff;border-radius:9px;padding:9px 13px}.btn.red{background:var(--red)}.btn.light{background:#f0f1f3;color:#222}.btn.danger{background:#fff0f0;color:var(--danger)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:11px 8px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:700}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;background:#eef0f2}.pill.ok{background:#e7f6ed;color:var(--ok)}.pill.warn{background:#fff4df;color:var(--warn)}.pill.bad{background:#ffe8e8;color:var(--danger)}.muted{color:var(--muted)}.hidden{display:none}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px}.modalbox{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px}.form{display:grid;gap:10px}.form label{font-size:12px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;right:20px;bottom:20px;background:#222;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:9}.empty{padding:35px;text-align:center;color:var(--muted)}.login{min-height:100vh;display:flex;align-items:center;justify-content:center}.loginbox{width:380px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 10px 40px #0001}.loginbox h1{margin:0 0 5px}.loginbox p{color:var(--muted);margin:0 0 20px}.loginbox input{width:100%;margin:6px 0;padding:12px;border:1px solid var(--line);border-radius:9px}.loginbox button{width:100%;margin-top:10px;padding:12px}.notice{font-size:12px;color:var(--muted);margin-top:12px}
@media(max-width:900px){.side{width:70px;padding:12px 8px}.brand{font-size:0}.brand:before{content:'МНП';font-size:15px}.brand small{display:none}.nav button{font-size:0;text-align:center}.nav .dot{margin:0}.main{margin-left:70px;width:calc(100% - 70px);padding:18px}.grid{grid-template-columns:repeat(2,1fr)}table{min-width:760px}.card{overflow:auto}.top{gap:10px}.row{grid-template-columns:1fr}}
</style></head><body>
<div id="app"></div><div id="toast" class="toast"></div><div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<script>
const API=location.origin, $=s=>document.querySelector(s); let token=localStorage.getItem('mnp_admin_token'), me=null, page='dashboard';
async function api(path,opt={}){opt.headers=Object.assign({'Content-Type':'application/json'},opt.headers||{});if(token)opt.headers.Authorization='Bearer '+token;let r=await fetch(API+path,opt);if(r.status===401){logout();throw new Error('Сесія завершилась')}let data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Помилка');return data}
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
function logout(){token=null;localStorage.removeItem('mnp_admin_token');renderLogin()}
function renderLogin(){document.body.innerHTML=`<div class="login"><div class="loginbox"><h1>Маршрутний Нова Пошта</h1><p>Панель адміністратора</p><input id="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Пароль"><button class="btn red" onclick="login()">Увійти</button><div class="notice">Доступ лише для акаунта з роллю admin.</div></div></div>`}
async function login(){try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#pass').value})});if(d.role!=='admin')throw Error('Цей акаунт не має прав адміністратора');token=d.token;localStorage.setItem('mnp_admin_token',token);location.reload()}catch(e){alert(e.message)}}
async function start(){try{let d=await api('/api/me');me=d.user;if(me.role!=='admin')return logout();renderShell();loadPage()}catch(e){renderLogin()}}
function renderShell(){document.body.innerHTML=`<div class="layout"><aside class="side"><div class="brand">Маршрутний Нова Пошта<small>Адмін-панель</small></div><div class="nav">${[['dashboard','Головна'],['users','Курʼєри'],['routes','Маршрути'],['proposals','На модерацію'],['districts','Райони'],['ratings','Оцінки'],['audit','Журнал'],['system','Система']].map(x=>`<button id="nav-${x[0]}" onclick="go('${x[0]}')"><i class="dot"></i>${x[1]}</button>`).join('')}</div><button class="nav" style="position:absolute;bottom:20px;left:14px;width:calc(100% - 28px);background:#25262a;color:#fff;padding:11px;border-radius:9px" onclick="logout()">Вийти</button></aside><main class="main"><div class="top"><h1 id="title">Головна</h1><div class="userbox">${esc(me.name)} · admin</div></div><div id="content"></div></main></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));$('#nav-'+p)?.classList.add('active');loadPage()}
async function loadPage(){let titles={dashboard:'Головна',users:'Курʼєри',routes:'Маршрути',proposals:'На модерацію',districts:'Райони',ratings:'Оцінки',audit:'Журнал',system:'Система'};$('#title').textContent=titles[page];try{if(page==='dashboard')await dashboard();if(page==='users')await users();if(page==='routes')await routes();if(page==='proposals')await proposals();if(page==='districts')await districts();if(page==='ratings')await ratings();if(page==='audit')await audit();if(page==='system')await system()}catch(e){$('#content').innerHTML='<div class="card">Помилка: '+esc(e.message)+'</div>'}}
async function dashboard(){let d=await api('/api/admin/summary');$('#content').innerHTML=`<div class="grid"><div class="stat"><span>Користувачі</span><b>${d.users.count}</b><small>${d.users.active} активних</small></div><div class="stat"><span>Опубліковані маршрути</span><b>${d.routes.published}</b></div><div class="stat"><span>На модерації</span><b>${d.routes.pending}</b></div><div class="stat"><span>Райони</span><b>${d.districts.count}</b></div></div><div class="card"><h3>Стан системи</h3><p>API та база даних працюють. Загальна кількість оцінок: <b>${d.ratings.count}</b>. Записів журналу: <b>${d.audit.count}</b>.</p><button class="btn red" onclick="go('proposals')">Перевірити маршрути на модерації</button></div>`}
async function users(){let d=await api('/api/admin/users');let rows=d.users.map(u=>`<tr><td>${u.id}</td><td><b>${esc(u.name)}</b><br><span class="muted">${esc(u.email)}</span></td><td>${esc(u.role)}</td><td><span class="pill ${u.active?'ok':'bad'}">${u.active?'Активний':'Заблокований'}</span></td><td>${new Date(u.created_at).toLocaleString('uk-UA')}</td><td><button class="btn light" onclick='editUser(${JSON.stringify(u)})'>Редагувати</button></td></tr>`).join('');$('#content').innerHTML=`<div class="toolbar"><button class="btn red" onclick="newUser()">+ Додати курʼєра</button><input id="uf" placeholder="Пошук..." oninput="filterTable('ut',this.value)"></div><div class="card"><table id="ut"><thead><tr><th>ID</th><th>Курʼєр</th><th>Роль</th><th>Статус</th><th>Створено</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=6 class=empty>Немає користувачів</td></tr>'}</tbody></table></div>`}
function filterTable(id,q){q=q.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function modal(html){$('#modalbox').innerHTML=html;$('#modal').classList.remove('hidden')};function closeModal(){$('#modal').classList.add('hidden')}
function newUser(){modal(`<h2>Новий користувач</h2><div class=form><input id=nname placeholder="Імʼя"><input id=nemail placeholder="E-mail"><input id=npass type=password placeholder="Пароль (6+)" ><select id=nrole><option value=courier>Курʼєр</option><option value=experienced>Досвідчений курʼєр</option><option value=admin>Адміністратор</option></select><div><button class="btn red" onclick="saveNewUser()">Створити</button> <button class="btn light" onclick="closeModal()">Скасувати</button></div></div>`)}
async function saveNewUser(){try{await api('/api/admin/users',{method:'POST',body:JSON.stringify({name:$('#nname').value,email:$('#nemail').value,password:$('#npass').value,role:$('#nrole').value})});closeModal();toast('Користувача створено');users()}catch(e){alert(e.message)}}
function editUser(u){modal(`<h2>Користувач #${u.id}</h2><div class=form><label>Імʼя</label><input id=ename value="${esc(u.name)}"><label>Роль</label><select id=erole><option ${u.role==='courier'?'selected':''} value=courier>Курʼєр</option><option ${u.role==='experienced'?'selected':''} value=experienced>Досвідчений курʼєр</option><option ${u.role==='admin'?'selected':''} value=admin>Адміністратор</option></select><label>Новий пароль (не обовʼязково)</label><input id=epass type=password placeholder="Залишити без змін"><label><input id=eactive type=checkbox ${u.active?'checked':''}> Активний</label><div><button class="btn red" onclick="saveUser(${u.id})">Зберегти</button> <button class="btn light" onclick="closeModal()">Скасувати</button></div></div>`)}
async function saveUser(id){try{let b={name:$('#ename').value,role:$('#erole').value,active:$('#eactive').checked};if($('#epass').value)b.password=$('#epass').value;await api('/api/admin/users/'+id,{method:'PATCH',body:JSON.stringify(b)});closeModal();toast('Зміни збережено');users()}catch(e){alert(e.message)}}
async function routes(){let d=await api('/api/admin/routes');let rows=d.routes.map(r=>`<tr><td>${r.id}</td><td><b>№${esc(r.district)}</b><br>${esc(r.author)}</td><td>${esc(r.date||'—')} ${esc(r.time||'')}</td><td>${r.points?.length||0}</td><td><span class="pill ${r.status==='published'?'ok':r.status==='pending'?'warn':'bad'}">${esc(r.status)}</span></td><td>${esc(r.source)}</td><td><button class="btn light" onclick='editRoute(${JSON.stringify(r).replace(/'/g,'&#39;')})'>Редагувати</button> <button class="btn danger" onclick="delRoute(${r.id})">Видалити</button></td></tr>`).join('');$('#content').innerHTML=`<div class="toolbar"><button class="btn red" onclick="newRoute()">+ Новий маршрут</button><input id=rf placeholder="Пошук району/автора..." oninput="filterTable('rt',this.value)"><button class="btn light" onclick="downloadBackup()">Експорт резервної копії</button></div><div class=card><table id=rt><thead><tr><th>ID</th><th>Район / автор</th><th>Дата</th><th>Точок</th><th>Статус</th><th>Тип</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=7 class=empty>Маршрутів немає</td></tr>'}</tbody></table></div>`}
function editRoute(r){modal(`<h2>Маршрут #${r.id}</h2><div class=form><div class=row><input id=rdistrict value="${esc(r.district)}" placeholder="Район"><input id=rauthor value="${esc(r.author)}" placeholder="Автор"></div><div class=row><input id=rdate value="${esc(r.date||'')}" placeholder="Дата"><input id=rtime value="${esc(r.time||'')}" placeholder="Час"></div><input id=rtitle value="${esc(r.title||'')}" placeholder="Назва"><select id=rstatus><option value=published ${r.status==='published'?'selected':''}>Опублікований</option><option value=pending ${r.status==='pending'?'selected':''}>На модерації</option><option value=rejected ${r.status==='rejected'?'selected':''}>Відхилений</option></select><textarea id=rpoints rows=12 placeholder="Одна адреса на рядок">${(r.points||[]).map(x=>typeof x==='string'?x:(x.address||JSON.stringify(x))).join('\n')}</textarea><div><button class="btn red" onclick="saveRoute(${r.id})">Зберегти</button> <button class="btn light" onclick="closeModal()">Скасувати</button></div></div>`)}
async function saveRoute(id){try{let points=$('#rpoints').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);await api('/api/admin/routes/'+id,{method:'PATCH',body:JSON.stringify({district:$('#rdistrict').value,author:$('#rauthor').value,date:$('#rdate').value,time:$('#rtime').value,title:$('#rtitle').value,status:$('#rstatus').value,points})});closeModal();toast('Маршрут збережено');routes()}catch(e){alert(e.message)}}
async function delRoute(id){if(!confirm('Видалити маршрут назавжди?'))return;try{await api('/api/admin/routes/'+id,{method:'DELETE'});toast('Маршрут видалено');routes()}catch(e){alert(e.message)}}
function newRoute(){modal(`<h2>Новий загальний маршрут</h2><div class=form><div class=row><input id=nd placeholder="Район №"><input id=na placeholder="Автор"></div><div class=row><input id=ndate placeholder="Дата"><input id=ntime placeholder="Час"></div><input id=ntitle placeholder="Назва"><textarea id=np rows=12 placeholder="Адреси, кожна з нового рядка"></textarea><button class="btn red" onclick="saveNewRoute()">Створити</button></div>`)}
async function saveNewRoute(){try{let points=$('#np').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);await api('/api/admin/routes',{method:'POST',body:JSON.stringify({district:$('#nd').value,author:$('#na').value,date:$('#ndate').value,time:$('#ntime').value,title:$('#ntitle').value,points})});closeModal();toast('Маршрут створено');routes()}catch(e){alert(e.message)}}
async function proposals(){let d=await api('/api/admin/routes');let p=d.routes.filter(r=>r.status==='pending');let rows=p.map(r=>`<tr><td><b>№${esc(r.district)}</b></td><td>${esc(r.author)}<br><span class=muted>${esc(r.ownerEmail||'')}</span></td><td>${esc(r.date||'—')}</td><td>${r.points?.length||0}</td><td><button class="btn red" onclick="approve(${r.id})">Опублікувати</button> <button class="btn danger" onclick="reject(${r.id})">Відхилити</button> <button class="btn light" onclick='editRoute(${JSON.stringify(r).replace(/'/g,'&#39;')})'>Переглянути</button></td></tr>`).join('');$('#content').innerHTML=`<div class=card><h3>Маршрути від курʼєрів</h3><p class=muted>Перевіряй маршрут перед публікацією. Оригінал особистого маршруту курʼєра не змінюється.</p><table><thead><tr><th>Район</th><th>Автор</th><th>Дата</th><th>Точок</th><th>Дія</th></tr></thead><tbody>${rows||'<tr><td colspan=5 class=empty>Немає маршрутів на модерації</td></tr>'}</tbody></table></div>`}
async function approve(id){if(!confirm('Опублікувати маршрут у загальній базі?'))return;await api('/api/admin/routes/'+id,{method:'PATCH',body:JSON.stringify({status:'published',source:'Загальний'})});toast('Маршрут опубліковано');proposals()}
async function reject(id){if(!confirm('Відхилити маршрут?'))return;await api('/api/admin/routes/'+id,{method:'PATCH',body:JSON.stringify({status:'rejected'})});toast('Маршрут відхилено');proposals()}
async function districts(){let d=await api('/api/admin/districts');let rows=d.districts.map(x=>`<tr><td><b>№${esc(x.number)}</b></td><td>${esc(x.name||'')}</td><td>${x.active?'<span class="pill ok">Активний</span>':'<span class="pill bad">Вимкнений</span>'}</td><td>${esc(x.notes||'')}</td><td><button class="btn light" onclick='editDistrict(${JSON.stringify(x)})'>Редагувати</button> <button class="btn danger" onclick="delDistrict(${x.id})">Видалити</button></td></tr>`).join('');$('#content').innerHTML=`<div class=toolbar><button class="btn red" onclick="newDistrict()">+ Додати район</button><input placeholder="Пошук" oninput="filterTable('dt',this.value)"></div><div class=card><table id=dt><thead><tr><th>Номер</th><th>Назва</th><th>Статус</th><th>Примітка</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=5 class=empty>Районів немає</td></tr>'}</tbody></table></div>`}
function newDistrict(){modal(`<h2>Новий район</h2><div class=form><input id=dn placeholder="Номер району"><input id=dname placeholder="Назва (необовʼязково)"><textarea id=dnotes placeholder="Примітка"></textarea><button class="btn red" onclick="saveDistrict()">Створити</button></div>`)}
async function saveDistrict(){try{await api('/api/admin/districts',{method:'POST',body:JSON.stringify({number:$('#dn').value,name:$('#dname').value,notes:$('#dnotes').value})});closeModal();toast('Район створено');districts()}catch(e){alert(e.message)}}
function editDistrict(x){modal(`<h2>Район №${esc(x.number)}</h2><div class=form><input id=dn value="${esc(x.number)}"><input id=dname value="${esc(x.name||'')}"><textarea id=dnotes>${esc(x.notes||'')}</textarea><label><input id=da type=checkbox ${x.active?'checked':''}> Активний</label><button class="btn red" onclick="saveDistrictEdit(${x.id})">Зберегти</button></div>`)}
async function saveDistrictEdit(id){try{await api('/api/admin/districts/'+id,{method:'PATCH',body:JSON.stringify({number:$('#dn').value,name:$('#dname').value,notes:$('#dnotes').value,active:$('#da').checked})});closeModal();districts()}catch(e){alert(e.message)}}
async function delDistrict(id){if(!confirm('Видалити район?'))return;await api('/api/admin/districts/'+id,{method:'DELETE'});districts()}
async function ratings(){let d=await api('/api/admin/ratings');let rows=d.ratings.map(r=>`<tr><td>${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</td><td>№${esc(r.district)} — ${esc(r.author)}</td><td>${esc(r.userName)}<br><span class=muted>${esc(r.userEmail)}</span></td><td>${esc(r.comment||'')}</td><td>${new Date(r.createdAt).toLocaleString('uk-UA')}</td><td><button class="btn danger" onclick="delRating(${r.id})">Видалити</button></td></tr>`).join('');$('#content').innerHTML=`<div class=card><table><thead><tr><th>Оцінка</th><th>Маршрут</th><th>Користувач</th><th>Коментар</th><th>Дата</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=6 class=empty>Оцінок немає</td></tr>'}</tbody></table></div>`}
async function delRating(id){if(!confirm('Видалити оцінку?'))return;await api('/api/admin/ratings/'+id,{method:'DELETE'});toast('Оцінку видалено');ratings()}
async function audit(){let d=await api('/api/admin/audit');let rows=d.logs.map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString('uk-UA')}</td><td>${esc(x.userName||'Система')}</td><td>${esc(x.action)}</td><td>${esc(x.entity)} #${esc(x.entityId||'')}</td><td><code>${esc(JSON.stringify(x.details||{}))}</code></td></tr>`).join('');$('#content').innerHTML=`<div class=toolbar><input placeholder="Пошук журналу" oninput="filterTable('at',this.value)"></div><div class=card><table id=at><thead><tr><th>Час</th><th>Хто</th><th>Дія</th><th>Обʼєкт</th><th>Деталі</th></tr></thead><tbody>${rows}</tbody></table></div>`}
async function system(){let d=await api('/api/health');$('#content').innerHTML=`<div class=grid><div class=stat><span>API</span><b>${d.ok?'OK':'ERROR'}</b></div><div class=stat><span>PostgreSQL</span><b>${d.db?'OK':'ERROR'}</b></div><div class=stat><span>Серверний час</span><b style="font-size:16px">${new Date(d.serverTime).toLocaleString('uk-UA')}</b></div><div class=stat><span>Адмін</span><b style="font-size:16px">${esc(me.email)}</b></div></div><div class=card><h3>Резервна копія</h3><p class=muted>Експорт містить користувачів, маршрути, райони, оцінки та журнал дій.</p><button class="btn red" onclick="downloadBackup()">Завантажити JSON</button></div>`}
async function downloadBackup(){try{let r=await fetch(API+'/api/admin/export',{headers:{Authorization:'Bearer '+token}});let b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='marshrutnyi-nova-poshta-backup.json';a.click();URL.revokeObjectURL(a.href)}catch(e){alert(e.message)}}
if(token)start();else renderLogin();
</script></body></html>
